<style>
  
  .prod-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px 28px; }
  .prod-card { display: flex; flex-direction: column; color: inherit; }
  .prod-card .thumb { aspect-ratio: 3 / 4; background: #f4f6f9; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 11px; letter-spacing: .15em; color: #14306b; font-weight: 700; }
  .prod-card .thumb img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; transition: transform .5s ease; }
  .prod-card:hover .thumb img { transform: scale(1.03); }
  .prod-card .body { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 18px 2px 0; }
  .prod-card .mcount { display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #14306b; text-transform: uppercase; margin-bottom: 6px; }
  .prod-card h4 { font-size: 18px; font-weight: 700; color: #0a1428; line-height: 1.3; letter-spacing: -0.01em; }
  .prod-card .go { flex: none; font-size: 20px; line-height: 1; color: #14306b; padding-bottom: 2px; transition: transform .2s; }
  .prod-card:hover .go { transform: translateX(4px); }
  @media (max-width: 1000px) { .prod-grid { grid-template-columns: repeat(2, 1fr); gap: 28px 20px; } }
  @media (max-width: 560px) { .prod-grid { gap: 22px 14px; } .prod-card .body { padding-top: 12px; } .prod-card h4 { font-size: 15px; } .prod-card .mcount { font-size: 10px; } .prod-card .go { font-size: 17px; } }
</style>
<link href="../assets/css/theme-apple.css" rel="stylesheet"/>
</head>
<body data-base=".." data-lang="en" data-nav="products">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe height="0" src="https://www.googletagmanager.com/ns.html?id=GTM-5QVPMLVK" style="display:none;visibility:hidden" width="0"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div id="bp-header-slot"></div>
<section class="page-hero" id="hero">
<nav class="breadcrumb">
<a href="index.html">Products</a>
<span class="sep">/</span>
<span id="crumb-cat"></span>
</nav>
<h1 id="h1"><span class="en" id="h1-en"></span></h1>
<p class="lead" id="desc"></p>
</section>
<main class="page-body">
<div class="prod-grid" id="prods"></div>
</main>
<div id="bp-footer-slot"></div>
<script src="../assets/js/data-bundle.js"></script>
<script src="../assets/js/chrome.js"></script>
<script>
(async function () {
  const catId = window.bpQuery('cat');
  if (!catId) { location.replace('index.html'); return; }

  const res = await fetch('../assets/data/products.json');
  const data = await res.json();
  const lang = window.bpLang();
  const cat = data.categories.find(c => c.id === catId);
  if (!cat) {
    document.getElementById('h1').textContent = 'Not Found';
    return;
  }

  document.title = `${cat.name[lang]} · ${cat.sub[lang]} | Bioprotech`;
  document.getElementById('crumb-cat').textContent = cat.name[lang];
  
  document.getElementById('h1').innerHTML = `${cat.name[lang]}<span class="en" id="h1-en">${cat.sub[lang]}</span>`;
  document.getElementById('desc').textContent = cat.desc[lang];

  const prods = data.products
    .filter(p => p.cat === catId)
    .sort((a,b) => a.order - b.order);

  document.getElementById('prods').innerHTML = prods.map(p => `
    <a class="prod-card" href="detail.html?id=${p.id}" title="${p.tagline[lang]}">
      ${p.images ? `<div class="thumb"><img src="../assets/img/products/thumb/${p.id}.jpg" onerror="this.onerror=null;this.src='../assets/img/products/${p.images[0]}'" alt="${p.name[lang]}" loading="lazy"></div>` : `<div class="thumb">${({ko:'Image pending', en:'Image pending', es:'Imagen pendiente'})[lang]}</div>`}
      <div class="body">
        <div>${p.spec && p.spec.rows ? `<span class="mcount">${p.spec.rows.length} ${({ko:'models', en:'models', es:'modelos'})[lang]}</span>` : ''}<h4>${p.name[lang]}</h4></div>
        <span class="go" aria-hidden="true">→</span>
      </div>
    </a>
  `).join('');
})();
</script>
</body>
</html>
